<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#182338"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#2ecc71"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000088"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#ff9933" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Geometric Innovation Compass Ring -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 10" stroke-opacity="0.3"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="url(#blueGrad)" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Compass Star Points -->
  <polygon points="250,90 268,232 410,250 268,268 250,410 232,268 90,250 232,232" fill="#14213d" stroke="url(#saffronGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Inner Ashoka-Inspired Innovation Core -->
  <circle cx="250" cy="250" r="60" fill="#0f172a" stroke="url(#blueGrad)" stroke-width="5"/>
  <circle cx="250" cy="250" r="20" fill="url(#saffronGrad)"/>

  <!-- Database / Schema Symbol Nodes -->
  <circle cx="250" cy="150" r="10" fill="#ff9933" filter="url(#glow)"/>
  <circle cx="350" cy="250" r="10" fill="#2ecc71" filter="url(#glow)"/>
  <circle cx="250" cy="350" r="10" fill="#2ecc71" filter="url(#glow)"/>
  <circle cx="150" cy="250" r="10" fill="#ff9933" filter="url(#glow)"/>

  <!-- Connecting Schema Lines -->
  <line x1="250" y1="160" x2="250" y2="190" stroke="#ff9933" stroke-width="3"/>
  <line x1="310" y1="250" x2="340" y2="250" stroke="#2ecc71" stroke-width="3"/>
  <line x1="250" y1="310" x2="250" y2="340" stroke="#2ecc71" stroke-width="3"/>
  <line x1="160" y1="250" x2="190" y2="250" stroke="#ff9933" stroke-width="3"/>
</svg>
